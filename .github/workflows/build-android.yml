
name: Build TDLib Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gperf \
            php-cli \
            perl \
            cmake \
            ninja-build \
            make \
            unzip \
            zip \
            wget \
            curl \
            openjdk-17-jdk

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare build scripts
        working-directory: example/android
        run: chmod +x *.sh

      - name: Check environment
        working-directory: example/android
        run: ./check-environment.sh

      - name: Fetch Android SDK and NDK
        working-directory: example/android
        run: ./fetch-sdk.sh

      - name: Build OpenSSL
        working-directory: example/android
        run: ./build-openssl.sh

      - name: Build TDLib
        working-directory: example/android
        run: ./build-tdlib.sh

      - name: Upload TDLib packages
        uses: actions/upload-artifact@v4
        with:
          name: MultiHub-TDLib-Android
          path: |
            example/android/tdlib.zip
            example/android/tdlib-debug.zip
          if-no-files-found: error
          retention-days: 14
